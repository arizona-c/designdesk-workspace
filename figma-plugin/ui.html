<meta charset="utf-8">
<style>
  /* Design Deskのデザイン言語をプラグインに移植（2026-08-30 オーナー要望）。
     zincベースの白黒基調 + 機能色チップ + カード。Figmaのライト/ダークは light-dark() で追従 */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 12px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: light-dark(#fafafa, #2c2c31); color: light-dark(#18181b, #f4f4f5);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  :root {
    --ink-mid: light-dark(#71717a, #a1a1aa);
    --ink-faint: light-dark(#a1a1aa, #71717a);
    --line: light-dark(#e4e4e7, #44444a);
    --line-strong: light-dark(#d4d4d8, #55555c);
    --surface: light-dark(#ffffff, #1e1e23);
    --surface2: light-dark(#f4f4f5, #38383e);
    --btn: light-dark(#18181b, #e4e4e7);
    --btn-ink: light-dark(#ffffff, #18181b);
    --link: light-dark(#2563eb, #60a5fa);
    --amber-bg: light-dark(#fef3c7, #451a03);
    --amber-ink: light-dark(#92400e, #fcd34d);
    --blue-bg: light-dark(#dbeafe, #172554);
    --blue-ink: light-dark(#1d4ed8, #93c5fd);
    --red: light-dark(#b91c1c, #fca5a5);
    --green: light-dark(#047857, #6ee7b7);
  }
  .sub { color: var(--ink-mid); }
  .faint { color: var(--ink-faint); }

  /* ヘッダー（スティッキー） */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 7px;
    padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 700; font-size: 12px; letter-spacing: .2px; }
  header .proj {
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; color: var(--ink-mid); background: var(--surface2);
    border-radius: 99px; padding: 2px 8px;
  }
  header .spacer { flex: 1; }
  .iconbtn {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border: none; background: none; border-radius: 6px; color: var(--ink-faint); cursor: pointer; padding: 0;
  }
  .iconbtn:hover { background: var(--surface2); color: inherit; }

  main { padding: 12px; }

  h1 { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 11px; font-weight: 700; margin: 14px 0 4px; }

  input, textarea, select {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 12px;
    border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: inherit; outline: none;
  }
  textarea { resize: vertical; min-height: 64px; field-sizing: content; max-height: 220px; }
  select {
    appearance: none; cursor: pointer; padding-right: 26px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none'%3E%3Cpath d='M3 4.5l3 3 3-3' stroke='%238b8b93' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 8px center; background-size: 11px;
  }

  button.btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; font: inherit;
    font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: inherit;
  }
  button.btn:hover { background: var(--surface2); }
  button.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  button.btn.primary:hover { opacity: .85; }
  button.btn.sm { height: 26px; padding: 0 9px; font-size: 11px; font-weight: 500; }
  button:disabled { opacity: .4; cursor: default; pointer-events: none; }

  /* チケットカード（アプリのボードカードと同じ流儀） */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; margin-top: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .12s;
  }
  .card:hover { border-color: var(--line-strong); }
  .chip {
    display: inline-flex; align-items: center; padding: 1.5px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 700; background: var(--surface2); color: var(--ink-mid);
  }
  .chip.seq { font-weight: 600; font-family: ui-monospace, monospace; }
  .chip.rev { background: var(--amber-bg); color: var(--amber-ink); }
  .chip.own { background: var(--blue-bg); color: var(--blue-ink); }
  .card .title { margin-top: 4px; font-weight: 500; line-height: 1.45; }
  .card .meta { margin-top: 5px; font-size: 10px; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; }

  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mt { margin-top: 10px; }
  .msg { margin-top: 10px; font-size: 11px; line-height: 1.5; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 詳細のセクション枠 */
  .section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; margin-top: 8px; }
  .section h2 { margin: 0 0 6px; }
  .framelink { display: flex; align-items: center; gap: 5px; font-size: 11px; margin-top: 3px; }

  /* 画面遷移（一覧⇄詳細のスライド感） */
  .view { animation: slidein .16s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  .view.back { animation: slideback .16s ease-out; }
  @keyframes slideback { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

  .backlink { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-mid); cursor: pointer; }
  .backlink:hover { color: inherit; text-decoration: none; }

  .empty {
    margin-top: 14px; padding: 18px 12px; text-align: center; font-size: 11px; color: var(--ink-faint);
    border: 1px dashed var(--line-strong); border-radius: 8px;
  }

  /* リサイズハンドル（右下ドラッグ→figma.ui.resize） */
  #resizer {
    position: fixed; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 9;
  }
  #resizer::after {
    content: ""; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px;
    border-right: 2px solid var(--line-strong); border-bottom: 2px solid var(--line-strong);
    border-radius: 1px;
  }
</style>

<header>
  <!-- ブランド: アプリのfaviconと同じセリフDロゴ（開発版はFigmaメニュー側にアイコンを出せないためUI内で示す） -->
  <svg width="18" height="18" viewBox="0 0 80 81" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0.5" y="0.5" width="79" height="79" rx="15.5" fill="#FBF7EF" stroke="#D0D0D0"/>
    <path d="M18.8516 17.8125H39.5938C44.7969 17.8125 49.3438 19.0547 53.2344 21.5391C59.1406 25.3828 62.0938 31.2188 62.0938 39.0469C62.0938 45.1875 60.0312 50.2031 55.9062 54.0938C51.6875 58.0312 46.3203 60 39.8047 60H18.8516V58.1016H24.4766V19.7109H18.8516V17.8125ZM39.8047 19.7109H34.3203V58.1016H39.6641C41.8672 58.1016 43.7188 57.6562 45.2188 56.7656C49.1094 54.4688 51.0547 48.4453 51.0547 38.6953C51.0547 33.8203 50.5859 29.9062 49.6484 26.9531C48.0078 22.125 44.7266 19.7109 39.8047 19.7109Z" fill="black"/>
  </svg>
  <span class="brand">Design Desk</span>
  <span class="proj" id="hd-proj" style="display:none"></span>
  <span class="spacer"></span>
  <button class="iconbtn" id="hd-reload" title="更新" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="iconbtn" id="hd-help" title="使い方FAQを開く" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
</header>

<main><div id="app">読み込み中…</div></main>
<div id="resizer" title="ドラッグでサイズ変更"></div>

<script>
  const app = document.getElementById("app");
  let S = { token: null, project: null, fileKey: null, fileName: "", selection: [], data: null, open: null, creating: false, capturing: false, editing: false, msg: null, dir: "fwd", sort: "list", onlyDoing: false, comments: null, commentsFor: null, commentBusy: false };
  const API = "https://designdesk.arizona-c.com/api/plugin";

  parent.postMessage({ pluginMessage: { type: "init" } }, "*");

  // ---- アイコン（UIコントロールに絵文字を使わない・アプリと同方針） ----
  const I = {
    plus: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    camera: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
    palette: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>',
    link: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    pencil: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    left: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    target: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
    external: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    send: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
  };

  // ---- Figma本体との通信 ----
  const exportWaiters = {};
  let exportSeq = 0;
  function exportNodes(ids) {
    return new Promise((resolve) => {
      const requestId = ++exportSeq;
      exportWaiters[requestId] = resolve;
      parent.postMessage({ pluginMessage: { type: "export-nodes", ids, requestId } }, "*");
      setTimeout(() => { if (exportWaiters[requestId]) { delete exportWaiters[requestId]; resolve([]); } }, 30000);
    });
  }

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === "exported") {
      const w = exportWaiters[m.requestId];
      if (w) { delete exportWaiters[m.requestId]; w(m.images); }
    } else if (m.type === "design-system") {
      if (!m.ok) { S.msg = { t: "err", text: "読み取りに失敗: " + m.error }; render(); return; }
      (async () => {
        try {
          S.msg = { t: "ok", text: "Design Deskへ送信中…" }; render();
          const r = await api("POST", null, { action: "sync_design_system", collections: m.collections, textStyles: m.textStyles });
          S.msg = { t: "ok", text: r.message };
          parent.postMessage({ pluginMessage: { type: "notify", message: "デザインシステムを同期しました" } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      })();
    } else if (m.type === "goto-result") {
      if (!m.ok && m.url) window.open(m.url, "_blank");
    } else if (m.type === "settings") {
      S.token = m.token; S.project = m.project; S.fileKey = m.fileKey; S.fileName = m.fileName;
      if (m.sort) S.sort = m.sort;
      S.onlyDoing = !!m.onlyDoing;
      if (S.token && S.project) load(); else render();
    } else if (m.type === "selection") {
      S.selection = m.nodes; render();
    }
  };

  async function api(method, params, body) {
    const res = await fetch(API + "?project=" + encodeURIComponent(S.project), {
      method,
      headers: { Authorization: "Bearer " + S.token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "通信に失敗しました" }));
    if (!res.ok) throw new Error(j.error || "エラーが発生しました");
    return j;
  }

  async function uploadCaptures(seq, phase, ids, labelBase) {
    const images = await exportNodes(ids);
    let ok = 0;
    for (let i = 0; i < images.length; i++) {
      const img = images[i];
      const name = labelBase
        ? images.length > 1 ? labelBase + "-" + (i + 1) : labelBase
        : img.name;
      try {
        await api("POST", null, { action: "upload_capture", seq, phase, node_name: name, data: img.data });
        ok++;
      } catch (err) { /* サイズ超過等はスキップして続行 */ }
    }
    return ok;
  }

  async function loadComments(seq) {
    S.commentsFor = seq; S.comments = null;
    try {
      const r = await api("POST", null, { action: "comments", seq });
      if (S.commentsFor === seq) { S.comments = r.comments; render(); }
    } catch (err) { if (S.commentsFor === seq) { S.comments = []; render(); } }
  }

  async function load() {
    try { S.data = await api("GET"); S.msg = null; }
    catch (err) { S.data = null; S.msg = { t: "err", text: err.message }; }
    render();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  // URLをリンク化してHTML化（エスケープ済み文字列を返す）
  function linkify(s) {
    return String(s).split(/(https?:\/\/[^\s<>"]+)/g).map((p) =>
      /^https?:\/\//.test(p)
        ? '<a href="' + esc(p) + '" target="_blank" style="word-break:break-all">' + esc(p) + "</a>"
        : esc(p)
    ).join("");
  }
  function go(patch, dir) { Object.assign(S, patch); S.dir = dir || "fwd"; render(); }

  // ---- ヘッダー ----
  function syncHeader() {
    const proj = document.getElementById("hd-proj");
    const reload = document.getElementById("hd-reload");
    const help = document.getElementById("hd-help");
    const connected = !!(S.token && S.project && S.data);
    proj.style.display = connected ? "" : "none";
    reload.style.display = connected ? "" : "none";
    help.style.display = connected ? "" : "none";
    if (connected) proj.textContent = S.data.project.name;
    reload.onclick = load;
    help.onclick = () => window.open("https://designdesk.arizona-c.com/" + encodeURIComponent(S.project) + "/faq#" + encodeURIComponent("Figmaプラグイン"), "_blank");
  }

  function render() {
    syncHeader();
    if (!S.token || !S.project) { renderSetup(); return; }
    if (!S.data) { app.innerHTML = '<div class="view">' + (S.msg ? msgHtml() + retryBtn() : "読み込み中…") + "</div>"; bindRetry(); return; }
    renderTickets();
  }

  function viewWrap(html) { return '<div class="view' + (S.dir === "back" ? " back" : "") + '">' + html + "</div>"; }
  function msgHtml() { return S.msg ? '<p class="msg ' + S.msg.t + '">' + esc(S.msg.text) + "</p>" : ""; }
  function retryBtn() { return '<p class="mt row"><button class="btn" id="retry">再読み込み</button><button class="btn sm" id="logout">接続をやり直す</button></p>'; }
  function bindRetry() {
    const r = document.getElementById("retry"); if (r) r.onclick = load;
    const l = document.getElementById("logout"); if (l) l.onclick = () => parent.postMessage({ pluginMessage: { type: "logout" } }, "*");
  }

  function renderSetup() {
    app.innerHTML = viewWrap(
      "<h1>アカウントにつなぐ</h1>" +
      '<p class="sub">Design Desk のアカウントメニュー →「アクセストークン」で発行した dd_pat_… を貼り付けてください。</p>' +
      '<div class="mt"><input id="project" placeholder="プロジェクトID（ディレクターから聞いた名前。例: app-dev）" value="' + esc(S.project || "") + '"></div>' +
      '<div class="mt"><input id="token" type="password" placeholder="dd_pat_…"></div>' +
      '<p class="mt"><button class="btn primary" id="save">接続する</button></p>' + msgHtml());
    document.getElementById("save").onclick = () => {
      const project = document.getElementById("project").value.trim();
      const token = document.getElementById("token").value.trim();
      if (!project || !token) return;
      parent.postMessage({ pluginMessage: { type: "save-settings", token, project } }, "*");
    };
  }

  function ticketCard(t) {
    return (
      '<div class="card" data-seq="' + t.seq + '">' +
      '<div class="row" style="gap:5px">' +
      '<span class="chip seq">#' + t.seq + "</span>" +
      '<span class="chip' + (t.role === "レビュー" ? " rev" : " own") + '">' + esc(t.role) + "</span>" +
      '<span class="chip">' + esc(t.column) + "</span>" +
      (t.due ? '<span class="faint" style="font-size:10px;margin-left:auto">期日 ' + esc(t.due.slice(5).replace("-", "/")) + "</span>" : "") +
      "</div>" +
      '<div class="title">' + esc(t.title) + "</div>" +
      (t.frames.length ? '<div class="meta">' + I.link + " Frame×" + t.frames.length + "</div>" : "") +
      "</div>"
    );
  }

  // 並び順: list=リスト順（ボードの列の並び×列内の手動並び）/ due=期日が近い順 / id=チケットID順
  function sortedTickets(list) {
    const a = list.slice();
    if (S.sort === "due") a.sort((x, y) => (x.due ? Date.parse(x.due) : Infinity) - (y.due ? Date.parse(y.due) : Infinity) || x.seq - y.seq);
    else if (S.sort === "id") a.sort((x, y) => x.seq - y.seq);
    else a.sort((x, y) => (x.columnIndex ?? 0) - (y.columnIndex ?? 0) || (x.sort ?? 0) - (y.sort ?? 0) || x.seq - y.seq);
    return a;
  }

  function renderTickets() {
    const d = S.data;
    if (S.creating) { renderCreate(); return; }
    if (S.open != null) { renderDetail(); return; }
    app.innerHTML = viewWrap(
      '<div class="row" style="justify-content:space-between">' +
      "<h1 style=\"margin:0\">自分のチケット</h1>" +
      '<span class="row" style="gap:6px"><select id="sort" title="表示順" style="width:auto;padding:2px 24px 2px 8px;font-size:10px;border-radius:99px;background-color:var(--surface2);border:none;color:var(--ink-mid)">' +
      '<option value="list"' + (S.sort === "list" ? " selected" : "") + '>リスト順</option>' +
      '<option value="due"' + (S.sort === "due" ? " selected" : "") + '>期日が近い順</option>' +
      '<option value="id"' + (S.sort === "id" ? " selected" : "") + '>ID順</option>' +
      '</select><label class="faint" style="font-size:10px;display:inline-flex;align-items:center;gap:3px;cursor:pointer"><input type="checkbox" id="onlydoing" style="width:auto;margin:0;accent-color:var(--btn)"' + (S.onlyDoing ? " checked" : "") + '>作業中のみ</label></span></div>' +
      '<div class="row mt">' +
      '<button class="btn primary sm" id="newticket">' + I.plus + "チケット作成</button>" +
      (d.can_sync_ds ? '<button class="btn sm" id="syncds" title="このファイルのVariable CollectionsとテキストスタイルをDesign Deskのデザインシステム正本へ取り込みます（ディレクター専用）">' + I.palette + "DS同期</button>" : "") +
      '<button class="btn sm" id="logout" style="margin-left:auto">接続をやり直す</button></div>' +
      (function () {
        const list = S.onlyDoing ? d.tickets.filter((t) => t.columnRole === "doing") : d.tickets;
        return list.length
          ? sortedTickets(list).map(ticketCard).join("")
          : '<div class="empty">' + (S.onlyDoing ? "作業中のチケットはありません" : "進行中の担当チケットはありません") + "</div>";
      })() +
      msgHtml());
    app.querySelectorAll(".card").forEach((c) => (c.onclick = () => { const sq = Number(c.dataset.seq); loadComments(sq); go({ open: sq, msg: null }, "fwd"); }));
    document.getElementById("sort").onchange = (e) => {
      S.sort = e.target.value;
      parent.postMessage({ pluginMessage: { type: "save-sort", sort: S.sort } }, "*");
      render();
    };
    document.getElementById("onlydoing").onchange = (e) => {
      S.onlyDoing = e.target.checked;
      parent.postMessage({ pluginMessage: { type: "save-only-doing", value: S.onlyDoing } }, "*");
      render();
    };
    document.getElementById("newticket").onclick = () => go({ creating: true, msg: null }, "fwd");
    const sds = document.getElementById("syncds");
    if (sds) sds.onclick = () => {
      S.msg = { t: "ok", text: "このファイルのCollectionsを読み取っています…" }; render();
      parent.postMessage({ pluginMessage: { type: "read-design-system" } }, "*");
    };
    document.getElementById("logout").onclick = () => { S.data = null; parent.postMessage({ pluginMessage: { type: "logout" } }, "*"); };
  }

  function backLink(label, onclick) {
    return '<a class="backlink" id="back">' + I.left + (label || "一覧へ") + "</a>";
  }

  function renderCreate() {
    const selInfo = S.selection.length
      ? "選択中のFrame（" + S.selection.map((n) => esc(n.name)).join(" / ") + "）を自動で紐づけます"
      : "Frameを選択してから作成すると自動で紐づけます（選択なしでも作成OK）";
    app.innerHTML = viewWrap(
      backLink() +
      '<h1 class="mt">チケット作成</h1>' +
      '<p class="sub">あなたが担当者としてインボックスに登録されます</p>' +
      '<div class="mt"><input id="nt-title" placeholder="タイトル：対象＋やること（略号や内部用語は避けて平易に）"></div>' +
      '<div class="mt"><textarea id="nt-desc" placeholder="メモ（なぜ気になったか・完了条件など。任意）"></textarea></div>' +
      '<p class="mt sub" style="font-size:11px">' + selInfo + "</p>" +
      '<p class="mt"><button class="btn primary" id="nt-create">作成する</button></p>' +
      msgHtml());
    document.getElementById("back").onclick = (e) => { e.preventDefault(); go({ creating: false }, "back"); };
    document.getElementById("nt-create").onclick = async () => {
      const title = document.getElementById("nt-title").value.trim();
      const description = document.getElementById("nt-desc").value.trim();
      if (!title) { S.msg = { t: "err", text: "タイトルを入れてください" }; render(); return; }
      const sel = S.selection.slice();
      const urls = S.fileKey ? sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-")) : [];
      const names = sel.map((n) => n.name);
      try {
        S.msg = { t: "ok", text: "作成しています…" }; render();
        const r = await api("POST", null, { action: "create", title, description, urls, names });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load();
        S.creating = false;
        S.open = r.seq;
        loadComments(r.seq);
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
  }

  function renderDetail() {
    const t = S.data.tickets.find((x) => x.seq === S.open);
    if (!t) { S.open = null; render(); return; }
    if (S.editing) {
      app.innerHTML = viewWrap(
        backLink("詳細へ戻る") +
        '<h1 class="mt">#' + t.seq + " を編集</h1>" +
        '<div class="mt"><input id="ed-title" value="' + esc(t.title) + '"></div>' +
        '<div class="mt"><textarea id="ed-desc" placeholder="説明" style="min-height:96px">' + esc(t.description || "") + "</textarea></div>" +
        '<p class="mt row"><button class="btn primary" id="ed-save">保存</button><button class="btn" id="ed-cancel">やめる</button></p>' +
        '<p class="faint" style="font-size:10px">変更は履歴に残り、Webのチケット詳細からいつでも巻き戻せます</p>' +
        msgHtml());
      document.getElementById("back").onclick = (e) => { e.preventDefault(); go({ editing: false }, "back"); };
      document.getElementById("ed-cancel").onclick = () => go({ editing: false }, "back");
      document.getElementById("ed-save").onclick = async () => {
        const title = document.getElementById("ed-title").value.trim();
        const description = document.getElementById("ed-desc").value;
        if (!title) { S.msg = { t: "err", text: "タイトルは空にできません" }; render(); return; }
        try {
          const r = await api("POST", null, { action: "update", seq: t.seq, title, description });
          parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
          await load(); S.editing = false; S.open = t.seq; S.msg = { t: "ok", text: r.message };
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      };
      return;
    }
    const selNames = S.selection.map((n) => esc(n.name)).join(" / ");
    const needKey = !S.fileKey;
    app.innerHTML = viewWrap(
      '<div class="row" style="justify-content:space-between">' + backLink() +
      '<span class="row" style="gap:10px">' +
      '<a href="' + esc("https://designdesk.arizona-c.com/" + encodeURIComponent(S.project) + "/board/" + t.seq) + '" target="_blank" class="backlink" title="Design Deskでチケット詳細を開く">' + I.external + "DesignDeskで開く</a>" +
      '<a href="#" id="edit" class="backlink" title="タイトル・説明を編集">' + I.pencil + "編集</a></span></div>" +
      '<div class="row mt" style="gap:5px"><span class="chip seq">#' + t.seq + '</span>' +
      '<span class="chip' + (t.role === "レビュー" ? " rev" : " own") + '">' + esc(t.role) + "</span>" +
      // 状態セレクター（チップの並びに溶け込むリスト移動）
      '<select id="status" style="width:auto;padding:2px 24px 2px 8px;font-size:11px;border-radius:99px;background-color:var(--surface2);border:none">' +
      S.data.columns.map((c) => '<option value="' + esc(c.name) + '"' + (c.name === t.column ? " selected" : "") + ">" + esc(c.name) + (c.role === "review" ? "（提出）" : "") + "</option>").join("") +
      "</select></div>" +
      '<h1 class="mt" style="margin-bottom:0">' + esc(t.title) + "</h1>" +
      (t.description ? '<p class="sub" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0">' + linkify(t.description) + "</p>" : "") +

      '<div class="section"><h2>Figmaリンク</h2>' +
      (t.frames.length
        ? t.frames.map((u, i) => '<a href="#" class="framelink frame-link" data-url="' + esc(u) + '">' + I.link + " " + esc((t.frameNames && t.frameNames[u]) || "Frame " + (i + 1)) + '<span class="faint" style="font-size:9px">（クリックで移動）</span></a>').join("")
        : '<p class="faint" style="font-size:11px;margin:0">まだ紐づけがありません</p>') +
      '<div class="row mt"><input id="addurl" placeholder="FigmaのURLを貼って紐づけ" style="flex:1;min-width:100px;font-size:11px;padding:5px 8px"><button class="btn sm" id="addurlgo">追加</button></div>' +
      "</div>" +

      '<div class="section"><h2>選択中のFrame</h2>' +
      (S.selection.length
        ? '<p style="font-size:11px;margin:0 0 8px" class="sub">' + I.target + " " + selNames + "</p>"
        : '<p class="faint" style="font-size:11px;margin:0 0 8px">作業対象のFrameをキャンバスで選択してください（複数可）。紐づけておくとレビュアーとClaudeが対象を正確に特定できます。</p>') +
      (needKey
        ? '<p class="faint" style="font-size:11px">初回だけ: このファイルのURL（ブラウザのアドレス欄からコピー）を貼ってください。選択Frameへのリンク作成に必要です。</p>' +
          '<input id="fileurl" placeholder="https://www.figma.com/design/…" style="font-size:11px">' +
          '<p class="mt"><button class="btn sm" id="savekey">URLを追加</button></p>'
        : '<div class="row"><button class="btn primary sm" id="attach"' + (S.selection.length ? "" : " disabled") + '>' + I.link + "紐づける</button>" +
          '<button class="btn sm" id="capture"' + (S.selection.length ? "" : " disabled") + ' title="選択中のFrameのキャプチャを撮って、このチケットに貼ります">' + I.camera + "キャプチャ</button></div>" +
          (S.capturing
            ? '<div class="row mt"><input id="capname" placeholder="キャプチャの名前（空ならFrame名）" style="flex:1;min-width:100px;font-size:11px;padding:5px 8px">' +
              '<button class="btn primary sm" id="capgo">撮る</button><button class="btn sm" id="capcancel">やめる</button></div>'
            : "")) +
      "</div>" +

      '<div class="section"><h2>作業報告</h2>' +
      '<p class="faint" style="font-size:10px;margin:0 0 4px">作業が完了したらここに完了報告を書きます。レビュー時に最上位に表示されます</p>' +
      '<textarea id="rp-body" placeholder="変更点・対象画面・確認したこと・気になる点（簡潔・事実ベースで）" style="min-height:56px;font-size:11px">' + esc(t.report || "") + "</textarea>" +
      '<p style="margin:6px 0 0;text-align:right"><button class="btn primary sm" id="rp-save">保存</button></p>' +
      "</div>" +

      '<div class="section"><h2>コメント' + (S.comments ? "（" + S.comments.length + "）" : "") + "</h2>" +
      (S.comments === null
        ? '<p class="faint" style="font-size:11px;margin:0">読み込み中…</p>'
        : S.comments.length
          ? S.comments.map((c) => '<div style="margin-bottom:7px"><span class="faint" style="font-size:10px">' + esc(c.author) + " ・ " + esc(c.at) + '</span><div style="font-size:11px;white-space:pre-wrap;line-height:1.5">' + esc(c.body) + "</div></div>").join("")
          : '<p class="faint" style="font-size:11px;margin:0 0 4px">まだコメントはありません</p>') +
      '<textarea id="cm-body" placeholder="FBコメントを書く（担当者に通知されます）" style="min-height:44px;font-size:11px;margin-top:4px"></textarea>' +
      '<p style="margin:6px 0 0;text-align:right"><button class="btn primary sm" id="cm-send"' + (S.commentBusy ? " disabled" : "") + ">" + I.send + "送信</button></p>" +
      "</div>" +
      msgHtml());
    document.getElementById("back").onclick = (e) => { e.preventDefault(); go({ open: null }, "back"); };
    const ed = document.getElementById("edit");
    if (ed) ed.onclick = (e) => { e.preventDefault(); go({ editing: true, msg: null }, "fwd"); };
    const aug = document.getElementById("addurlgo");
    if (aug) aug.onclick = async () => {
      const url = (document.getElementById("addurl").value || "").trim();
      if (!/figma\.com\//.test(url)) { S.msg = { t: "err", text: "FigmaのURLを貼ってください" }; render(); return; }
      try {
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls: [url] });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq; S.msg = { t: "ok", text: r.message };
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    app.querySelectorAll(".frame-link").forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        const url = a.dataset.url;
        const m2 = url.match(/node-id=([\d]+)-([\d]+)/);
        if (m2) parent.postMessage({ pluginMessage: { type: "goto-node", nodeId: m2[1] + ":" + m2[2], url } }, "*");
        else window.open(url, "_blank");
      };
    });
    const sk = document.getElementById("savekey");
    if (sk) sk.onclick = () => {
      const m2 = (document.getElementById("fileurl").value || "").match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)/);
      if (m2) parent.postMessage({ pluginMessage: { type: "save-filekey", fileKey: m2[1] } }, "*");
      else { S.msg = { t: "err", text: "URLからファイルIDを読み取れませんでした" }; render(); }
    };
    const at = document.getElementById("attach");
    if (at) at.onclick = async () => {
      try {
        const sel = S.selection.slice();
        const urls = sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-"));
        const names = sel.map((n) => n.name);
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls, names });
        S.msg = { t: "ok", text: r.message };
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq;
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    const cap = document.getElementById("capture");
    if (cap) cap.onclick = () => { S.capturing = !S.capturing; render(); if (S.capturing) { const el = document.getElementById("capname"); if (el) el.focus(); } };
    const capgo = document.getElementById("capgo");
    if (capgo) capgo.onclick = async () => {
      const label = (document.getElementById("capname").value || "").trim();
      const sel = S.selection.slice();
      S.capturing = false;
      S.msg = { t: "ok", text: "キャプチャを記録しています…" };
      render();
      const ok = await uploadCaptures(t.seq, "manual", sel.map((n) => n.id), label || null);
      S.msg = ok
        ? { t: "ok", text: "キャプチャ" + ok + "件をチケットに貼りました" }
        : { t: "err", text: "キャプチャを記録できませんでした（サイズ超過の可能性）" };
      if (ok) parent.postMessage({ pluginMessage: { type: "notify", message: "キャプチャ" + ok + "件を記録しました" } }, "*");
      render();
    };
    const capcancel = document.getElementById("capcancel");
    if (capcancel) capcancel.onclick = () => { S.capturing = false; render(); };
    document.getElementById("rp-save").onclick = async () => {
      const text = document.getElementById("rp-body").value.trim();
      if (!text) { S.msg = { t: "err", text: "作業報告を入力してください" }; render(); return; }
      try {
        const r = await api("POST", null, { action: "save_report", seq: t.seq, report: text });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq; S.msg = { t: "ok", text: r.message };
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    document.getElementById("cm-send").onclick = async () => {
      const el = document.getElementById("cm-body");
      const text = el.value.trim();
      if (!text || S.commentBusy) return;
      S.commentBusy = true; render();
      try {
        const r = await api("POST", null, { action: "add_comment", seq: t.seq, body: text });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        S.commentBusy = false;
        await loadComments(t.seq);
      } catch (err) { S.commentBusy = false; S.msg = { t: "err", text: err.message }; render(); }
    };
    document.getElementById("status").onchange = (e) => {
      const toName = e.target.value;
      if (toName === t.column) return;
      move(t.seq, toName);
    };
  }

  async function move(seq, toName) {
    try {
      const r = await api("POST", null, { action: "move", seq, column: toName });
      S.msg = { t: "ok", text: r.message };
      parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
      await load(); S.open = seq;
    } catch (err) { S.msg = { t: "err", text: err.message }; }
    render();
  }

  // ---- リサイズハンドル（右下ドラッグ→本体側でfigma.ui.resize+サイズ記憶） ----
  (() => {
    const rz = document.getElementById("resizer");
    let start = null;
    rz.addEventListener("pointerdown", (e) => {
      start = { x: e.clientX, y: e.clientY, w: window.innerWidth, h: window.innerHeight };
      rz.setPointerCapture(e.pointerId);
    });
    rz.addEventListener("pointermove", (e) => {
      if (!start) return;
      const w = Math.round(start.w + (e.clientX - start.x));
      const h = Math.round(start.h + (e.clientY - start.y));
      parent.postMessage({ pluginMessage: { type: "resize", width: w, height: h } }, "*");
    });
    rz.addEventListener("pointerup", (e) => {
      start = null;
      rz.releasePointerCapture(e.pointerId);
      parent.postMessage({ pluginMessage: { type: "resize-save" } }, "*");
    });
  })();
</script>
