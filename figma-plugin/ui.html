<meta charset="utf-8">
<style>
  /* Design Deskのデザイン言語をプラグインに移植（2026-08-30 オーナー要望）。
     zincベースの白黒基調 + 機能色チップ + カード。Figmaのライト/ダークは light-dark() で追従 */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 12px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: light-dark(#fafafa, #2c2c31); color: light-dark(#18181b, #f4f4f5);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  :root {
    --ink-mid: light-dark(#71717a, #a1a1aa);
    --ink-faint: light-dark(#a1a1aa, #71717a);
    --line: light-dark(#e4e4e7, #44444a);
    --line-strong: light-dark(#d4d4d8, #55555c);
    --surface: light-dark(#ffffff, #1e1e23);
    --surface2: light-dark(#f4f4f5, #38383e);
    --btn: light-dark(#18181b, #e4e4e7);
    --btn-ink: light-dark(#ffffff, #18181b);
    --link: light-dark(#2563eb, #60a5fa);
    --amber-bg: light-dark(#fef3c7, #451a03);
    --amber-ink: light-dark(#92400e, #fcd34d);
    --blue-bg: light-dark(#dbeafe, #172554);
    --blue-ink: light-dark(#1d4ed8, #93c5fd);
    --red: light-dark(#b91c1c, #fca5a5);
    --green: light-dark(#047857, #6ee7b7);
  }
  .sub { color: var(--ink-mid); }
  .faint { color: var(--ink-faint); }

  /* ヘッダー（スティッキー） */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 7px;
    padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 700; font-size: 12px; letter-spacing: .2px; }
  header .proj {
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; color: var(--ink-mid); background: var(--surface2);
    border-radius: 99px; padding: 2px 8px;
  }
  header .spacer { flex: 1; }
  /* 詳細・作成・編集の間だけ左端に出る戻るボタン（スティッキーなので下までスクロールしても押せる） */
  header .hd-back {
    display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px 0 6px; margin-left: -4px;
    border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface2); color: inherit;
    font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  header .hd-back:hover { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .iconbtn {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border: none; background: none; border-radius: 6px; color: var(--ink-faint); cursor: pointer; padding: 0;
  }
  .iconbtn:hover { background: var(--surface2); color: inherit; }

  main { padding: 12px; }

  h1 { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 11px; font-weight: 700; margin: 14px 0 4px; }

  input, textarea, select {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 12px;
    border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: inherit; outline: none;
  }
  textarea { resize: vertical; min-height: 64px; field-sizing: content; max-height: 220px; }
  select {
    appearance: none; cursor: pointer; padding-right: 26px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none'%3E%3Cpath d='M3 4.5l3 3 3-3' stroke='%238b8b93' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 8px center; background-size: 11px;
  }

  button.btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; font: inherit;
    font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: inherit;
  }
  button.btn:hover { background: var(--surface2); }
  button.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  button.btn.primary:hover { opacity: .85; }
  button.btn.sm { height: 26px; padding: 0 9px; font-size: 11px; font-weight: 500; }
  button:disabled { opacity: .4; cursor: default; pointer-events: none; }

  /* チケットカード（アプリのボードカードと同じ流儀） */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; margin-top: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .12s;
  }
  .card:hover { border-color: var(--line-strong); }
  .chip {
    display: inline-flex; align-items: center; padding: 1.5px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 700; background: var(--surface2); color: var(--ink-mid);
  }
  .chip.seq { font-weight: 600; font-family: ui-monospace, monospace; }
  .chip.rev { background: var(--amber-bg); color: var(--amber-ink); }
  .chip.own { background: var(--blue-bg); color: var(--blue-ink); }
  .card .title { margin-top: 4px; font-weight: 500; line-height: 1.45; }
  .card .meta { margin-top: 5px; font-size: 10px; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; }

  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mt { margin-top: 10px; }
  .msg { margin-top: 10px; font-size: 11px; line-height: 1.5; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 詳細のセクション枠 */
  .scopebtn { border: 0; background: var(--surface2); color: var(--ink-mid); font-size: 10px; padding: 3px 9px; cursor: pointer; }
  .scopebtn.on { background: var(--btn); color: var(--btn-ink); }
  .md { font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
  .md p { margin: 0; }
  .md .mdgap { height: 6px; }
  .md .mdh { font-weight: 700; margin-top: 6px; }
  .md .mdq { border-left: 2px solid var(--line-strong); padding-left: 8px; color: var(--ink-mid); }
  .md ul, .md ol { margin: 2px 0; padding-left: 18px; }
  .md code { background: var(--surface2); border-radius: 3px; padding: 0 3px; font-family: ui-monospace, monospace; font-size: 10px; }
  .md pre { background: var(--surface2); border-radius: 6px; padding: 6px 8px; font-size: 10px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .md .mdimg { max-width: 100%; max-height: 220px; border: 1px solid var(--line); border-radius: 6px; margin: 4px 0; display: block; }
  .md .mdtable { border-collapse: collapse; font-size: 10px; margin: 4px 0; }
  .md .mdtable th, .md .mdtable td { border: 1px solid var(--line); padding: 2px 6px; text-align: left; vertical-align: top; }
  .md .mdtable th { background: var(--surface2); font-weight: 700; }
  .cm-clamp { max-height: 88px; overflow: hidden; position: relative; }
  .cm-clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(to bottom, transparent, var(--surface)); }
  .cm-more { display: inline-block; font-size: 10px; color: var(--link); cursor: pointer; margin-top: 2px; }
  .fold { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .fold .chev { display: inline-block; transition: transform .12s; color: var(--ink-faint); }
  .fold.closed .chev { transform: rotate(-90deg); }
  .md .mention { background: var(--blue-bg); color: var(--blue-ink); border-radius: 3px; padding: 0 3px; }
  .section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; margin-top: 8px; }
  .section h2 { margin: 0 0 6px; }
  .framelink { display: flex; align-items: center; gap: 5px; font-size: 11px; margin-top: 3px; }

  /* 画面遷移（一覧⇄詳細のスライド感） */
  .view { animation: slidein .16s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  .view.back { animation: slideback .16s ease-out; }
  @keyframes slideback { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

  .backlink { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-mid); cursor: pointer; }
  .backlink:hover { color: inherit; text-decoration: none; }

  .empty {
    margin-top: 14px; padding: 18px 12px; text-align: center; font-size: 11px; color: var(--ink-faint);
    border: 1px dashed var(--line-strong); border-radius: 8px;
  }

  /* リサイズハンドル（右下ドラッグ→figma.ui.resize） */
  #resizer {
    position: fixed; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 9;
  }
  #resizer::after {
    content: ""; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px;
    border-right: 2px solid var(--line-strong); border-bottom: 2px solid var(--line-strong);
    border-radius: 1px;
  }
</style>

<header>
  <!-- ブランド: アプリのfaviconと同じセリフDロゴ（開発版はFigmaメニュー側にアイコンを出せないためUI内で示す） -->
  <svg width="18" height="18" viewBox="0 0 80 81" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0.5" y="0.5" width="79" height="79" rx="15.5" fill="#FBF7EF" stroke="#D0D0D0"/>
    <path d="M18.8516 17.8125H39.5938C44.7969 17.8125 49.3438 19.0547 53.2344 21.5391C59.1406 25.3828 62.0938 31.2188 62.0938 39.0469C62.0938 45.1875 60.0312 50.2031 55.9062 54.0938C51.6875 58.0312 46.3203 60 39.8047 60H18.8516V58.1016H24.4766V19.7109H18.8516V17.8125ZM39.8047 19.7109H34.3203V58.1016H39.6641C41.8672 58.1016 43.7188 57.6562 45.2188 56.7656C49.1094 54.4688 51.0547 48.4453 51.0547 38.6953C51.0547 33.8203 50.5859 29.9062 49.6484 26.9531C48.0078 22.125 44.7266 19.7109 39.8047 19.7109Z" fill="black"/>
  </svg>
  <button class="hd-back" id="hd-back" style="display:none" title="一覧へ戻る"></button>
  <span class="brand" id="hd-brand">Design Desk</span>
  <span class="proj" id="hd-proj" style="display:none"></span>
  <span class="spacer"></span>
  <button class="iconbtn" id="hd-reload" title="更新" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="iconbtn" id="hd-help" title="使い方FAQを開く" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
</header>

<main><div id="app">読み込み中…</div></main>
<div id="resizer" title="ドラッグでサイズ変更"></div>

<script>
  const app = document.getElementById("app");
  let S = { token: null, project: null, fileKey: null, fileName: "", syncPanel: null, selection: [], data: null, open: null, creating: false, capturing: false, editing: false, msg: null, dir: "fwd", sort: "list", onlyDoing: false, scope: "mine", commentsOpen: true, expanded: {}, reportDraft: null, commentDraft: null, detailFull: false, wirePlan: null, toolBusy: false, reportBusy: false, captures: null, compImages: false, comments: null, commentsFor: null, commentBusy: false };
  // 接続先（Design Desk の URL）。既定は Arizona 運営の本番。独立デプロイの組織は設定画面で自組織の URL に変える（clientStorage に保存）
  const DEFAULT_BASE = "https://designdesk.arizona-c.com";
  let BASE = DEFAULT_BASE;
  let API = BASE + "/api/plugin";
  function setBase(url) {
    const u = (url || "").trim().replace(/\/+$/, "");
    BASE = /^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(u) ? u : DEFAULT_BASE;
    API = BASE + "/api/plugin";
  }

  parent.postMessage({ pluginMessage: { type: "init" } }, "*");

  // ---- アイコン（UIコントロールに絵文字を使わない・アプリと同方針） ----
  const I = {
    grid: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    plus: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    camera: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
    palette: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>',
    link: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    pencil: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    chev: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    left: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    target: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
    external: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    send: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
  };

  // ---- Figma本体との通信 ----
  const exportWaiters = {};
  let exportSeq = 0;
  function exportNodes(ids, width) {
    return new Promise((resolve) => {
      const requestId = ++exportSeq;
      exportWaiters[requestId] = resolve;
      parent.postMessage({ pluginMessage: { type: "export-nodes", ids, width: width || null, requestId } }, "*");
      setTimeout(() => { if (exportWaiters[requestId]) { delete exportWaiters[requestId]; resolve([]); } }, 30000);
    });
  }

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === "exported") {
      const w = exportWaiters[m.requestId];
      if (w) { delete exportWaiters[m.requestId]; w(m.images); }
    } else if (m.type === "design-system") {
      if (!m.ok) { S.msg = { t: "err", text: "読み取りに失敗: " + m.error }; render(); return; }
      (async () => {
        try {
          S.msg = { t: "ok", text: "Design Deskへ送信中…" }; render();
          const r = await api("POST", null, { action: "sync_design_system", collections: m.collections, textStyles: m.textStyles, file_key: S.fileKey });
          S.msg = { t: "ok", text: r.message };
          parent.postMessage({ pluginMessage: { type: "notify", message: "デザインシステムを同期しました" } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      })();
    } else if (m.type === "wire-progress" || m.type === "mock-progress") {
      S.msg = { t: "ok", text: "処理中… " + (m.done + 1) + "/" + m.total + "（" + m.page + "）" }; render();
    } else if (m.type === "wire-inventory-result") {
      (async () => {
        if (!m.ok) { S.toolBusy = false; S.msg = { t: "err", text: "棚卸しに失敗しました: " + m.error }; render(); return; }
        try {
          const r = await api("POST", null, { action: "wire_inventory", file_key: S.fileKey, file_name: m.fileName, pages: m.pages });
          S.msg = { t: "ok", text: r.message + "。次は作業フォルダの Claude に「ワイヤーのヒアリングをして」と頼んでください" };
          parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        S.toolBusy = false; render();
      })();
    } else if (m.type === "wire-drawn") {
      (async () => {
        if (!m.ok) { S.toolBusy = false; S.msg = { t: "err", text: "描画に失敗しました: " + m.error }; render(); return; }
        const pl = S.wirePlan || { screens: [], transitions: [] };
        try {
          const screenNames = {}; pl.screens.forEach((x) => { screenNames[x.id] = x.name; });
          await api("POST", null, { action: "wire_draw_done", file_key: S.fileKey, page_name: m.pageName, screen_ids: pl.screens.map((x) => x.id), transition_ids: pl.transitions.map((x) => x.id), screen_names: screenNames });
        } catch (err) { /* 記録の失敗は描画結果に影響しない */ }
        S.msg = { t: "ok", text: "ページ「" + m.pageName + "」に画面 " + (m.drawn + m.missing) + " 件（Frame から " + m.drawn + "・区画で " + m.missing + "）・遷移 " + m.lines + " 件を描きました" };
        parent.postMessage({ pluginMessage: { type: "notify", message: "ワイヤーを描きました: " + m.pageName } }, "*");
        S.wirePlan = null; S.toolBusy = false; render();
      })();
    } else if (m.type === "mock-extracted") {
      (async () => {
        if (!m.ok) { S.toolBusy = false; S.msg = { t: "err", text: "取り出しに失敗しました: " + m.error }; render(); return; }
        try {
          const r = await api("POST", null, { action: "mock_extract", file_key: S.fileKey, samples: m.samples });
          S.msg = { t: "ok", text: r.message + "。次は作業フォルダの Claude に「モックの知識を学習して」と頼んでください" };
          parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        S.toolBusy = false; render();
      })();
    } else if (m.type === "components-progress") {
      S.msg = { t: "ok", text: "読み取り中… " + (m.done + 1) + "/" + m.total + "ページ（" + m.page + "）" }; render();
      return;
    } else if (m.type === "components") {
      if (!m.ok) { S.msg = { t: "err", text: "読み取りに失敗: " + m.error }; render(); return; }
      (async () => {
        try {
          S.msg = { t: "ok", text: "Design Deskへ送信中…（" + m.components.length + "件）" }; render();
          const r = await api("POST", null, { action: "sync_components", components: m.components, usage: m.usage || {}, var_usage: m.varUsage || {}, file_key: S.fileKey });
          S.msg = { t: "ok", text: r.message };
          if (S.compImages && m.components.length) {
            const ids = m.components.map((c) => c.id);
            let first = true, sent = 0;
            for (let i = 0; i < ids.length; i += 8) {
              const batch = ids.slice(i, i + 8);
              const remainMin = Math.ceil(((ids.length - i) * 5) / 60);
              S.msg = { t: "ok", text: "画像を取得中… " + Math.min(i + 8, ids.length) + "/" + ids.length + "件（残り約" + remainMin + "分）" }; render();
              const images = await exportNodes(batch, 240);
              if (images.length) {
                await api("POST", null, { action: "upload_component_thumbs", file_key: S.fileKey, first: first, entries: images.map((im) => ({ id: im.id, data: im.data })) });
                first = false; sent += images.length;
              }
            }
            S.msg = { t: "ok", text: r.message + "（サムネ " + sent + "件も更新）" };
          }
          parent.postMessage({ pluginMessage: { type: "notify", message: "コンポーネント一覧を同期しました" } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      })();
    } else if (m.type === "goto-result") {
      if (!m.ok && m.url) window.open(m.url, "_blank");
    } else if (m.type === "settings") {
      setBase(m.url);
      S.token = m.token; S.project = m.project; S.fileKey = m.fileKey; S.fileName = m.fileName;
      if (m.sort) S.sort = m.sort;
      S.onlyDoing = !!m.onlyDoing;
      S.scope = m.scope === "all" ? "all" : "mine";
      if (S.token && S.project) load(); else render();
    } else if (m.type === "selection") {
      S.selection = m.nodes; render();
    }
  };

  async function api(method, params, body) {
    let url = API + "?project=" + encodeURIComponent(S.project);
    if (params) url += "&" + new URLSearchParams(params).toString();
    const res = await fetch(url, {
      method,
      headers: { Authorization: "Bearer " + S.token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "通信に失敗しました" }));
    if (!res.ok) throw new Error(j.error || "エラーが発生しました");
    return j;
  }

  // 撮れて記録できた添付を [{ id, name }] で返す（id は本文差し込み ![name](capture:id) に使う）
  async function uploadCaptures(seq, phase, ids, labelBase) {
    const images = await exportNodes(ids);
    const done = [];
    for (let i = 0; i < images.length; i++) {
      const img = images[i];
      const name = labelBase
        ? images.length > 1 ? labelBase + "-" + (i + 1) : labelBase
        : img.name;
      try {
        const r = await api("POST", null, { action: "upload_capture", seq, phase, node_name: name, data: img.data });
        done.push({ id: r.id, name });
      } catch (err) { /* サイズ超過等はスキップして続行 */ }
    }
    return done;
  }

  async function loadComments(seq) {
    S.commentsFor = seq; S.comments = null; S.captures = null;
    try {
      const r = await api("POST", null, { action: "comments", seq });
      if (S.commentsFor === seq) { S.comments = r.comments; S.captures = r.captures || []; render(); }
    } catch (err) { if (S.commentsFor === seq) { S.comments = []; S.captures = []; render(); } }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  // URLをリンク化してHTML化（エスケープ済み文字列を返す）
  function linkify(s) {
    return String(s).split(/(https?:\/\/[^\s<>"]+)/g).map((p) =>
      /^https?:\/\//.test(p)
        ? '<a href="' + esc(p) + '" target="_blank" style="word-break:break-all">' + esc(p) + "</a>"
        : esc(p)
    ).join("");
  }
  function go(patch, dir) { Object.assign(S, patch); S.dir = dir || "fwd"; render(); }

  // Markdown の簡易描画（Web と同じ書き方が読める最小セット・2026-09-08）。
  // 先にHTMLエスケープしてから記法を置き換えるので、生HTMLは描画されない。
  // 対応: 見出し（# / 【…】行）・太字・取り消し・インラインコード・コードブロック・箇条書き/番号・引用・区切り線・表・
  // リンク [t](url) / 裸URL・画像 ![説明](capture:ID)（同じチケットの添付だけ）/ 外部画像・@メンションの帯・改行はそのまま
  function mdInline(s, images) {
    let h = esc(s);
    h = h.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
    h = h.replace(/!\[([^\]]*)\]\(capture:([0-9a-f-]{36})\)/g, (m, alt, id) => {
      const hit = images && images[id];
      return hit ? '<a href="' + esc(hit.url) + '" target="_blank"><img class="mdimg" src="' + esc(hit.url) + '" alt="' + alt + '"></a>' : '<span class="faint">（削除された画像' + (alt ? ": " + alt : "") + '）</span>';
    });
    h = h.replace(/!\[([^\]]*)\]\((https?:[^\s)]+)\)/g, (m, alt, u) => '<img class="mdimg" src="' + u + '" alt="' + alt + '">');
    h = h.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, (m, t, u) => '<a href="' + u + '" target="_blank">' + t + '</a>');
    h = h.replace(/(^|[^"'>])(https?:\/\/[^\s<>"]+)/g, (m, pre, u) => pre + '<a href="' + u + '" target="_blank" style="word-break:break-all">' + u + '</a>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    h = h.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    h = h.replace(/(^|[\s　])[@＠]([^\s@＠<]{1,20})/g, (m, pre, n) => pre + '<span class="mention">@' + n + '</span>');
    return h;
  }
  function md(text, images) {
    const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
    const out = []; let list = null; let inCode = false; let code = []; let table = null;
    const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    const closeTable = () => { if (table) { out.push("<table class=\"mdtable\">" + table.join("") + "</table>"); table = null; } };
    for (const raw of lines) {
      if (/^```/.test(raw)) { if (inCode) { out.push("<pre>" + code.join("\n") + "</pre>"); code = []; inCode = false; } else { closeList(); closeTable(); inCode = true; } continue; }
      if (inCode) { code.push(esc(raw)); continue; }
      const line = raw.replace(/\s+$/, "");
      let m;
      if ((m = line.match(/^\|(.+)\|$/))) {
        closeList();
        const cells = m[1].split("|").map((c) => c.trim());
        if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue; // 区切り行
        if (!table) table = [];
        const tag = table.length === 0 ? "th" : "td";
        table.push("<tr>" + cells.map((c) => "<" + tag + ">" + mdInline(c, images) + "</" + tag + ">").join("") + "</tr>");
        continue;
      }
      closeTable();
      if (line === "") { closeList(); out.push('<div class="mdgap"></div>'); continue; }
      if ((m = line.match(/^\s*【[^】]{1,40}】\s*$/)) || (m = line.match(/^#{1,4}\s+(.+)$/))) { closeList(); out.push('<p class="mdh">' + mdInline(m[1] || line.trim(), images) + "</p>"); continue; }
      if (/^-{3,}$/.test(line)) { closeList(); out.push("<hr>"); continue; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { closeList(); list = "ul"; out.push("<ul>"); } out.push("<li>" + mdInline(m[1], images) + "</li>"); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { closeList(); list = "ol"; out.push("<ol>"); } out.push("<li>" + mdInline(m[1], images) + "</li>"); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { closeList(); out.push('<p class="mdq">' + mdInline(m[1], images) + "</p>"); continue; }
      closeList();
      out.push("<p>" + mdInline(line, images) + "</p>");
    }
    if (inCode) out.push("<pre>" + code.join("\n") + "</pre>");
    closeList(); closeTable();
    return '<div class="md">' + out.join("") + "</div>";
  }
  function captureMap() {
    const map = {};
    for (const c of S.captures || []) map[c.id] = c;
    return map;
  }

  // 並び順: list=リスト順（ボードの列の並び×列内の手動並び）/ due=期日が近い順 / id=チケットID順
  function sortedTickets(list) {
    const a = list.slice();
    if (S.sort === "due") a.sort((x, y) => (x.due ? Date.parse(x.due) : Infinity) - (y.due ? Date.parse(y.due) : Infinity) || x.seq - y.seq);
    else if (S.sort === "id") a.sort((x, y) => x.seq - y.seq);
    else a.sort((x, y) => (x.columnIndex ?? 0) - (y.columnIndex ?? 0) || (x.sort ?? 0) - (y.sort ?? 0) || x.seq - y.seq);
    return a;
  }

      render();
    };
    document.getElementById("newticket").onclick = () => go({ creating: true, msg: null }, "fwd");
    const startSync = (kind) => {
      if (kind === "ds") {
        S.msg = { t: "ok", text: "このファイル（" + S.fileName + "）のCollectionsを読み取っています…" }; render();
        parent.postMessage({ pluginMessage: { type: "read-design-system" } }, "*");
      } else {
        S.msg = { t: "ok", text: "全ページのコンポーネントを読み取っています…（大きいファイルは少し待ちます）" }; render();
        parent.postMessage({ pluginMessage: { type: "read-components" } }, "*");
      }
    };
    // 「設定」→メニュー→各説明パネル→実行、の段階的開示。普段の画面はチケットだけに保つ
    document.getElementById("settingsbtn").onclick = () => { S.syncPanel = S.syncPanel ? null : "menu"; S.msg = null; render(); };
    const sds = document.getElementById("syncds");
    if (sds) sds.onclick = () => { S.syncPanel = "ds"; S.msg = null; render(); };
    const scp = document.getElementById("synccomp");
    if (scp) scp.onclick = () => { S.syncPanel = "comp"; S.msg = null; render(); };
    const cb = document.getElementById("connbtn");
    if (cb) cb.onclick = () => { S.syncPanel = "conn"; S.msg = null; render(); };
    const ab = document.getElementById("askback");
    if (ab) ab.onclick = () => { S.syncPanel = "menu"; render(); };
    const cc = document.getElementById("connconfirm");
    if (cc) cc.onclick = () => { S.syncPanel = null; S.data = null; parent.postMessage({ pluginMessage: { type: "logout" } }, "*"); };
    const cimg = document.getElementById("compimgs");
    if (cimg) cimg.onchange = (e) => { S.compImages = e.target.checked; };
    const rs = document.getElementById("runsync");
    if (rs) rs.onclick = () => {
      if (!S.fileKey) {
        const m2 = (document.getElementById("fileurl2").value || "").match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)/);
        if (!m2) { S.msg = { t: "err", text: "URLからファイルIDを読み取れませんでした。「共有」→「リンクをコピー」で取り直してください" }; render(); return; }
        parent.postMessage({ pluginMessage: { type: "save-filekey", fileKey: m2[1] } }, "*");
        S.fileKey = m2[1];
      }
      const kind = S.syncPanel; S.syncPanel = null;
      startSync(kind);
    };

    if (ac) ac.onclick = (e) => { e.preventDefault(); S.syncPanel = null; render(); };
    // ---- ワイヤー生成 / モックアップ作成 ----
    const ensureFileKey = () => {
      if (S.fileKey) return true;
      const el = document.getElementById("fileurl2");
      const m2 = ((el && el.value) || "").match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)/);
      if (!m2) { S.msg = { t: "err", text: "URLからファイルIDを読み取れませんでした。「共有」→「リンクをコピー」で取り直してください" }; render(); return false; }
      parent.postMessage({ pluginMessage: { type: "save-filekey", fileKey: m2[1] } }, "*");
      S.fileKey = m2[1];
      return true;
    };
    const wb = document.getElementById("wirebtn");
    if (wb) wb.onclick = () => { S.syncPanel = "wire"; S.wirePlan = null; S.msg = null; render(); };
    const mb = document.getElementById("mockbtn");
    if (mb) mb.onclick = () => { S.syncPanel = "mock"; S.msg = null; render(); };
    const wi = document.getElementById("wireinv");
    if (wi) wi.onclick = async () => {
      if (!ensureFileKey()) return;
      S.toolBusy = true; S.msg = { t: "ok", text: "設定を読んでいます…" }; render();
      try {
        const plan = await api("POST", null, { action: "wire_plan" });
        S.msg = { t: "ok", text: "全ページを棚卸ししています…" }; render();
        parent.postMessage({ pluginMessage: { type: "wire-inventory", settings: plan.settings } }, "*");
      } catch (err) { S.toolBusy = false; S.msg = { t: "err", text: err.message }; render(); }
    };
    const wp = document.getElementById("wireplan");
    if (wp) wp.onclick = async () => {
      if (!ensureFileKey()) return;
      S.toolBusy = true; S.msg = { t: "ok", text: "Design Desk の画面と遷移を読んでいます…" }; render();
      try {
        const plan = await api("POST", null, { action: "wire_plan" });
        const d0 = new Date(), pad = (n) => String(n).padStart(2, "0");
        S.wirePlan = { screens: plan.screens || [], transitions: plan.transitions || [], settings: plan.settings || {}, last_draw: plan.last_draw || null, pageName: "Wire " + d0.getFullYear() + "-" + pad(d0.getMonth() + 1) + "-" + pad(d0.getDate()), diff: false };
        S.msg = null;
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      S.toolBusy = false; render();
    };
    const wd = document.getElementById("wirediff");
    if (wd) wd.onchange = (e) => { if (S.wirePlan) S.wirePlan.diff = e.target.checked; };
    const wpc = document.getElementById("wireplancancel");
    if (wpc) wpc.onclick = () => { S.wirePlan = null; render(); };
    const wg = document.getElementById("wirego");
    if (wg) wg.onclick = () => {
      const pl = S.wirePlan; if (!pl) return;
      const pageName = (document.getElementById("wirepage").value || "").trim() || pl.pageName;
      pl.pageName = pageName;
      const highlightIds = pl.diff && pl.last_draw ? pl.screens.filter((x) => !pl.last_draw.screen_ids.includes(x.id)).map((x) => x.id) : [];
      const removedNames = pl.diff && pl.last_draw ? pl.last_draw.screen_ids.filter((id) => !pl.screens.some((x) => x.id === id)).map((id) => (pl.last_draw.screen_names || {})[id] || "（名前不明）") : [];
      S.toolBusy = true; S.msg = { t: "ok", text: "新しいページに描いています…" }; render();
      parent.postMessage({ pluginMessage: { type: "wire-draw", pageName, screens: pl.screens, transitions: pl.transitions, settings: pl.settings, highlightIds, removedNames } }, "*");
    };
    const me = document.getElementById("mockextract");
    if (me) me.onclick = () => {
      if (!ensureFileKey()) return;
      S.toolBusy = true; S.msg = { t: "ok", text: "選択した画面から取り出しています…" }; render();
      parent.postMessage({ pluginMessage: { type: "mock-extract", ids: S.selection.map((n) => n.id) } }, "*");
    };
  }

      '<p style="margin:6px 0 0;text-align:right"><button class="btn primary sm" id="rp-save">保存</button></p>' +
      "</div>" +

      '<div class="section"><h2 class="fold' + (S.commentsOpen ? "" : " closed") + '" id="cm-fold" title="' + (S.commentsOpen ? "スレッドを仕舞う" : "スレッドを開く") + '"><span class="chev">' + I.chev + "</span>コメント" + (S.comments ? "（" + S.comments.length + "）" : "") + "</h2>" +
      (!S.commentsOpen
        ? (S.comments && S.comments.length ? '<p class="faint" style="font-size:10px;margin:0 0 4px">' + esc(S.comments[S.comments.length - 1].author) + " ・ " + esc(S.comments[S.comments.length - 1].at) + " が最新</p>" : "")
        : S.comments === null
        ? '<p class="faint" style="font-size:11px;margin:0">読み込み中…</p>'
        : S.comments.length
          ? S.comments.map((c) => {
              // 長い投稿は先頭だけ見せて「続きを読む」（文字数か行数で判定）
              const long = c.body.length > 220 || (c.body.match(/\n/g) || []).length >= 5;
              const open = !!S.expanded[c.id];
              return '<div style="margin-bottom:7px"><span class="faint" style="font-size:10px">' + esc(c.author) + " ・ " + esc(c.at) + "</span>" +
                '<div class="' + (long && !open ? "cm-clamp" : "") + '">' + md(c.body, captureMap()) + "</div>" +
                (long ? '<a class="cm-more" data-id="' + esc(c.id) + '">' + (open ? "折りたたむ" : "続きを読む") + "</a>" : "") + "</div>";
            }).join("")
          : '<p class="faint" style="font-size:11px;margin:0 0 4px">まだコメントはありません</p>') +
      '<textarea id="cm-body" placeholder="FBコメントを書く（担当者に通知されます）" style="min-height:44px;font-size:11px;margin-top:4px">' + esc(S.commentDraft && S.commentDraft.seq === t.seq ? S.commentDraft.value : "") + "</textarea>" +
      '<p style="margin:6px 0 0;text-align:right"><button class="btn primary sm" id="cm-send"' + (S.commentBusy ? " disabled" : "") + ">" + I.send + "送信</button></p>" +
      "</div>" +
      msgHtml());
    const ed = document.getElementById("edit");
    if (ed) ed.onclick = (e) => { e.preventDefault(); go({ editing: true, msg: null }, "fwd"); };
    const vs = document.getElementById("viewsum"), vf = document.getElementById("viewfull");
    if (vs) vs.onclick = () => { S.detailFull = false; render(); };
    if (vf) vf.onclick = () => { S.detailFull = true; render(); };
    const aug = document.getElementById("addurlgo");
    if (aug) aug.onclick = async () => {
      const url = (document.getElementById("addurl").value || "").trim();
      if (!/figma\.com\//.test(url)) { S.msg = { t: "err", text: "FigmaのURLを貼ってください" }; render(); return; }
      try {
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls: [url] });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq; S.msg = { t: "ok", text: r.message };
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    app.querySelectorAll(".frame-link").forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        const url = a.dataset.url;
        const m2 = url.match(/node-id=([\d]+)-([\d]+)/);
        if (m2) parent.postMessage({ pluginMessage: { type: "goto-node", nodeId: m2[1] + ":" + m2[2], url } }, "*");
        else window.open(url, "_blank");
      };
    });
    const sk = document.getElementById("savekey");
    if (sk) sk.onclick = () => {
      const m2 = (document.getElementById("fileurl").value || "").match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)/);
      if (m2) parent.postMessage({ pluginMessage: { type: "save-filekey", fileKey: m2[1] } }, "*");
      else { S.msg = { t: "err", text: "URLからファイルIDを読み取れませんでした" }; render(); }
    };
    const at = document.getElementById("attach");
    if (at) at.onclick = async () => {
      try {
        const sel = S.selection.slice();
        const urls = sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-"));
        const names = sel.map((n) => n.name);
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls, names });
        S.msg = { t: "ok", text: r.message };
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq;
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    const cap = document.getElementById("capture");
    if (cap) cap.onclick = () => { S.capturing = !S.capturing; render(); if (S.capturing) { const el = document.getElementById("capname"); if (el) el.focus(); } };
    const capgo = document.getElementById("capgo");
    if (capgo) capgo.onclick = async () => {
      const label = (document.getElementById("capname").value || "").trim();
      const sel = S.selection.slice();
      S.capturing = false;
      S.msg = { t: "ok", text: "キャプチャを記録しています…" };
      render();
      const ok = (await uploadCaptures(t.seq, "manual", sel.map((n) => n.id), label || null)).length;
      S.msg = ok
        ? { t: "ok", text: "キャプチャ" + ok + "件をチケットに貼りました" }
        : { t: "err", text: "キャプチャを記録できませんでした（サイズ超過の可能性）" };
      if (ok) parent.postMessage({ pluginMessage: { type: "notify", message: "キャプチャ" + ok + "件を記録しました" } }, "*");
      render();
    };
    const capcancel = document.getElementById("capcancel");
    if (capcancel) capcancel.onclick = () => { S.capturing = false; render(); };
    const rpCap = document.getElementById("rp-capture");
    if (rpCap) rpCap.onclick = async () => {
      const sel = S.selection.slice();
      if (!sel.length || S.reportBusy) return;
      S.reportBusy = true; S.msg = { t: "ok", text: "Figmaリンクとキャプチャを記録しています…" }; render();
      try {
        const urls = sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-"));
        const names = sel.map((n) => n.name);
        await api("POST", null, { action: "attach_frames", seq: t.seq, urls, names });
        const caps = await uploadCaptures(t.seq, "manual", sel.map((n) => n.id), null);
        await load(); S.open = t.seq;
        loadComments(t.seq); // キャプチャ一覧を最新に
        S.msg = caps.length
          ? { t: "ok", text: "Figmaリンク" + sel.length + "件とキャプチャ" + caps.length + "件をチケットに添付しました" }
          : { t: "err", text: "Figmaリンクは紐づけましたが、キャプチャを記録できませんでした（サイズ超過の可能性）" };
        parent.postMessage({ pluginMessage: { type: "notify", message: caps.length ? "リンクとキャプチャを添付しました" : "キャプチャを記録できませんでした" } }, "*");
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      S.reportBusy = false;
      render();
    };
    const rpBody = document.getElementById("rp-body");
    rpBody.oninput = () => { S.reportDraft = { seq: t.seq, value: rpBody.value }; };
    document.getElementById("rp-save").onclick = async () => {
      const text = document.getElementById("rp-body").value.trim();
      if (!text) { S.msg = { t: "err", text: "作業報告を入力してください" }; render(); return; }
      try {
        const r = await api("POST", null, { action: "save_report", seq: t.seq, report: text });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        S.reportDraft = null;
        await load(); S.open = t.seq; S.msg = { t: "ok", text: r.message };
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    document.getElementById("cm-fold").onclick = () => { S.commentsOpen = !S.commentsOpen; render(); };
    app.querySelectorAll(".cm-more").forEach((a) => { a.onclick = () => { S.expanded[a.dataset.id] = !S.expanded[a.dataset.id]; render(); }; });
    const cmBody = document.getElementById("cm-body");
    cmBody.oninput = () => { S.commentDraft = { seq: t.seq, value: cmBody.value }; };
    document.getElementById("cm-send").onclick = async () => {
      const el = document.getElementById("cm-body");
      const text = el.value.trim();
      if (!text || S.commentBusy) return;
      S.commentBusy = true; render();
      try {
        const r = await api("POST", null, { action: "add_comment", seq: t.seq, body: text });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        S.commentBusy = false; S.commentDraft = null;
        await loadComments(t.seq);
      } catch (err) { S.commentBusy = false; S.msg = { t: "err", text: err.message }; render(); }
    };
    document.getElementById("status").onchange = (e) => {
      const toName = e.target.value;
      if (toName === t.column) return;
      move(t.seq, toName);
    };
  }

  async function move(seq, toName) {
    try {
      const r = await api("POST", null, { action: "move", seq, column: toName });
      S.msg = { t: "ok", text: r.message };
      parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
      await load(); S.open = seq;
    } catch (err) { S.msg = { t: "err", text: err.message }; }
    render();
  }

  // ---- リサイズハンドル（右下ドラッグ→本体側でfigma.ui.resize+サイズ記憶） ----
  (() => {
    const rz = document.getElementById("resizer");
    let start = null;
    rz.addEventListener("pointerdown", (e) => {
      start = { x: e.clientX, y: e.clientY, w: window.innerWidth, h: window.innerHeight };
      rz.setPointerCapture(e.pointerId);
    });
    rz.addEventListener("pointermove", (e) => {
      if (!start) return;
      const w = Math.round(start.w + (e.clientX - start.x));
      const h = Math.round(start.h + (e.clientY - start.y));
      parent.postMessage({ pluginMessage: { type: "resize", width: w, height: h } }, "*");
    });
    rz.addEventListener("pointerup", (e) => {
      start = null;
      rz.releasePointerCapture(e.pointerId);
      parent.postMessage({ pluginMessage: { type: "resize-save" } }, "*");
    });
  })();
</script>
