<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 12px; font: 11px/1.6 -apple-system, "Hiragino Sans", sans-serif;
    background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #111);
  }
  h1 { font-size: 13px; margin: 0 0 4px; }
  .sub { color: var(--figma-color-text-secondary, #777); }
  input {
    width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font-size: 11px;
    border: 1px solid var(--figma-color-border, #ccc); border-radius: 5px;
    background: var(--figma-color-bg, #fff); color: inherit;
  }
  button {
    padding: 6px 10px; font-size: 11px; font-weight: 600; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--figma-color-border, #ccc); background: var(--figma-color-bg, #fff); color: inherit;
  }
  button.primary { background: #18a0fb; border-color: #18a0fb; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .card {
    border: 1px solid var(--figma-color-border, #ddd); border-radius: 8px;
    padding: 8px 10px; margin-top: 6px; cursor: pointer;
  }
  .card:hover { border-color: #18a0fb; }
  .chip {
    display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 700;
    background: var(--figma-color-bg-secondary, #f0f0f0); color: var(--figma-color-text-secondary, #777);
  }
  .chip.rev { background: #fff3cd; color: #8a6d1a; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mt { margin-top: 10px; }
  .msg { margin-top: 8px; font-size: 10px; }
  .msg.err { color: #e03e3e; }
  .msg.ok { color: #1a7f37; }
  a { color: #18a0fb; text-decoration: none; }
  .frames { font-size: 9px; color: var(--figma-color-text-secondary, #777); word-break: break-all; }
</style>

<div id="app">読み込み中…</div>

<script>
  const app = document.getElementById("app");
  let S = { token: null, project: null, fileKey: null, fileName: "", selection: [], data: null, open: null, creating: false, capturing: false, editing: false, msg: null };
  const API = "https://designdesk.arizona-c.com/api/plugin";

  parent.postMessage({ pluginMessage: { type: "init" } }, "*");

  const exportWaiters = {};
  let exportSeq = 0;
  function exportNodes(ids) {
    return new Promise((resolve) => {
      const requestId = ++exportSeq;
      exportWaiters[requestId] = resolve;
      parent.postMessage({ pluginMessage: { type: "export-nodes", ids, requestId } }, "*");
      setTimeout(() => { if (exportWaiters[requestId]) { delete exportWaiters[requestId]; resolve([]); } }, 30000);
    });
  }

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === "exported") {
      const w = exportWaiters[m.requestId];
      if (w) { delete exportWaiters[m.requestId]; w(m.images); }
    } else if (m.type === "design-system") {
      if (!m.ok) { S.msg = { t: "err", text: "読み取りに失敗: " + m.error }; render(); return; }
      (async () => {
        try {
          S.msg = { t: "ok", text: "Design Deskへ送信中…" }; render();
          const r = await api("POST", null, { action: "sync_design_system", collections: m.collections, textStyles: m.textStyles });
          S.msg = { t: "ok", text: r.message };
          parent.postMessage({ pluginMessage: { type: "notify", message: "デザインシステムを同期しました" } }, "*");
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      })();
    } else if (m.type === "goto-result") {
      if (!m.ok && m.url) window.open(m.url, "_blank");
    } else if (m.type === "settings") {
      S.token = m.token; S.project = m.project; S.fileKey = m.fileKey; S.fileName = m.fileName;
      if (S.token && S.project) load(); else render();
    } else if (m.type === "selection") {
      S.selection = m.nodes; render();
    }
  };

  async function api(method, params, body) {
    const res = await fetch(API + "?project=" + encodeURIComponent(S.project), {
      method,
      headers: { Authorization: "Bearer " + S.token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "通信に失敗しました" }));
    if (!res.ok) throw new Error(j.error || "エラーが発生しました");
    return j;
  }

  async function uploadCaptures(seq, phase, ids, labelBase) {
    const images = await exportNodes(ids);
    let ok = 0;
    for (let i = 0; i < images.length; i++) {
      const img = images[i];
      const name = labelBase
        ? images.length > 1 ? labelBase + "-" + (i + 1) : labelBase
        : img.name;
      try {
        await api("POST", null, { action: "upload_capture", seq, phase, node_name: name, data: img.data });
        ok++;
      } catch (err) { /* サイズ超過等はスキップして続行 */ }
    }
    return ok;
  }

  async function load() {
    try { S.data = await api("GET"); S.msg = null; }
    catch (err) { S.data = null; S.msg = { t: "err", text: err.message }; }
    render();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render() {
    if (!S.token || !S.project) { renderSetup(); return; }
    if (!S.data) { app.innerHTML = S.msg ? msgHtml() + retryBtn() : "読み込み中…"; bindRetry(); return; }
    renderTickets();
  }

  function msgHtml() { return S.msg ? '<p class="msg ' + S.msg.t + '">' + esc(S.msg.text) + "</p>" : ""; }
  function retryBtn() { return '<p class="mt"><button id="retry">再読み込み</button> <button id="logout">接続をやり直す</button></p>'; }
  function bindRetry() {
    const r = document.getElementById("retry"); if (r) r.onclick = load;
    const l = document.getElementById("logout"); if (l) l.onclick = () => parent.postMessage({ pluginMessage: { type: "logout" } }, "*");
  }

  function renderSetup() {
    app.innerHTML =
      "<h1>Design Desk につなぐ</h1>" +
      '<p class="sub">Design Desk のアカウントメニュー →「アクセストークン」で発行した dd_pat_… を貼り付けてください。</p>' +
      '<input id="project" placeholder="プロジェクトID（ディレクターから聞いた名前。例: app-dev）" value="' + esc(S.project || "") + '">' +
      '<input id="token" type="password" placeholder="dd_pat_…">' +
      '<p class="mt"><button class="primary" id="save">接続する</button></p>' + msgHtml();
    document.getElementById("save").onclick = () => {
      const project = document.getElementById("project").value.trim();
      const token = document.getElementById("token").value.trim();
      if (!project || !token) return;
      parent.postMessage({ pluginMessage: { type: "save-settings", token, project } }, "*");
    };
  }

  function ticketCard(t) {
    return (
      '<div class="card" data-seq="' + t.seq + '">' +
      '<div class="row"><span class="chip' + (t.role === "レビュー" ? " rev" : "") + '">' + esc(t.role) + "</span>" +
      '<span class="chip">' + esc(t.column) + "</span>" +
      (t.due ? '<span class="sub">期日 ' + esc(t.due.slice(5)) + "</span>" : "") + "</div>" +
      '<div style="margin-top:2px"><b>#' + t.seq + "</b> " + esc(t.title) + "</div>" +
      (t.frames.length ? '<div class="frames">🔗 Frame×' + t.frames.length + "</div>" : "") +
      "</div>"
    );
  }

  function renderTickets() {
    const d = S.data;
    if (S.creating) { renderCreate(); return; }
    if (S.open != null) { renderDetail(); return; }
    const faqUrl = "https://designdesk.arizona-c.com/" + encodeURIComponent(S.project) + "/faq#" + encodeURIComponent("Figmaプラグイン");
    app.innerHTML =
      "<h1>" + esc(d.project.name) + " — 自分のチケット</h1>" +
      '<p class="sub">' + esc(d.user.name) + ' さん｜ログイン中 / <a href="' + faqUrl + '" target="_blank">詳しい使い方はこちら</a></p>' +
      '<p class="row" style="margin-top:6px"><button class="primary" id="newticket">＋ チケット作成</button> <button id="reload">更新</button> ' +
      (d.can_sync_ds ? '<button id="syncds" title="このファイルのVariable CollectionsとテキストスタイルをDesign Deskのデザインシステム正本へ取り込みます（ディレクター専用）">🎨 デザインシステム同期</button> ' : "") +
      '<button id="logout">接続をやり直す</button></p>' +
      (d.tickets.length ? d.tickets.map(ticketCard).join("") : '<p class="mt sub">進行中の担当チケットはありません</p>') +
      msgHtml();
    app.querySelectorAll(".card").forEach((c) => (c.onclick = () => { S.open = Number(c.dataset.seq); S.msg = null; render(); }));
    document.getElementById("newticket").onclick = () => { S.creating = true; S.msg = null; render(); };
    const sds = document.getElementById("syncds");
    if (sds) sds.onclick = () => {
      S.msg = { t: "ok", text: "このファイルのCollectionsを読み取っています…" }; render();
      parent.postMessage({ pluginMessage: { type: "read-design-system" } }, "*");
    };
    document.getElementById("reload").onclick = load;
    document.getElementById("logout").onclick = () => { S.data = null; parent.postMessage({ pluginMessage: { type: "logout" } }, "*"); };
  }

  function renderCreate() {
    const selInfo = S.selection.length
      ? "選択中のFrame（" + S.selection.map((n) => esc(n.name)).join(" / ") + "）を自動で紐づけます"
      : "Frameを選択してから作成すると自動で紐づけます（選択なしでも作成OK）";
    app.innerHTML =
      '<p><a href="#" id="back">← 一覧へ</a></p>' +
      "<h1>チケット作成</h1>" +
      '<p class="sub">あなたが担当者として「未着手」に登録されます</p>' +
      '<input id="nt-title" placeholder="タイトル（対象＋やること）">' +
      '<textarea id="nt-desc" placeholder="メモ（なぜ気になったか・完了条件など。任意）" style="width:100%;box-sizing:border-box;margin-top:6px;min-height:64px;padding:6px 8px;font:inherit;border:1px solid var(--figma-color-border,#ccc);border-radius:5px;background:var(--figma-color-bg,#fff);color:inherit"></textarea>' +
      '<p class="mt sub">' + selInfo + "</p>" +
      '<p class="mt"><button class="primary" id="nt-create">作成する</button></p>' +
      msgHtml();
    document.getElementById("back").onclick = (e) => { e.preventDefault(); S.creating = false; render(); };
    document.getElementById("nt-create").onclick = async () => {
      const title = document.getElementById("nt-title").value.trim();
      const description = document.getElementById("nt-desc").value.trim();
      if (!title) { S.msg = { t: "err", text: "タイトルを入れてください" }; render(); return; }
      const sel = S.selection.slice();
      const urls = S.fileKey ? sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-")) : [];
      try {
        S.msg = { t: "ok", text: "作成しています…" }; render();
        const r = await api("POST", null, { action: "create", title, description, urls });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load();
        S.creating = false;
        S.open = r.seq;
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
  }

  function renderDetail() {
    const t = S.data.tickets.find((x) => x.seq === S.open);
    if (!t) { S.open = null; render(); return; }
    if (S.editing) {
      app.innerHTML =
        '<p><a href="#" id="back">← 詳細へ戻る</a></p>' +
        "<h1>#" + t.seq + " を編集</h1>" +
        '<input id="ed-title" value="' + esc(t.title) + '">' +
        '<textarea id="ed-desc" placeholder="説明" style="width:100%;box-sizing:border-box;margin-top:6px;min-height:96px;padding:6px 8px;font:inherit;border:1px solid var(--figma-color-border,#ccc);border-radius:5px;background:var(--figma-color-bg,#fff);color:inherit">' + esc(t.description || "") + "</textarea>" +
        '<p class="mt row"><button class="primary" id="ed-save">保存</button><button id="ed-cancel">やめる</button></p>' +
        '<p class="sub">変更は履歴に残り、Webのチケット詳細からいつでも巻き戻せます</p>' +
        msgHtml();
      document.getElementById("back").onclick = (e) => { e.preventDefault(); S.editing = false; render(); };
      document.getElementById("ed-cancel").onclick = () => { S.editing = false; render(); };
      document.getElementById("ed-save").onclick = async () => {
        const title = document.getElementById("ed-title").value.trim();
        const description = document.getElementById("ed-desc").value;
        if (!title) { S.msg = { t: "err", text: "タイトルは空にできません" }; render(); return; }
        try {
          const r = await api("POST", null, { action: "update", seq: t.seq, title, description });
          parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
          await load(); S.editing = false; S.open = t.seq; S.msg = { t: "ok", text: r.message };
        } catch (err) { S.msg = { t: "err", text: err.message }; }
        render();
      };
      return;
    }
    const selInfo = S.selection.length
      ? "選択中: " + S.selection.map((n) => esc(n.name)).join(" / ")
      : "作業対象のFrameをFigmaのキャンバスで選択してください（複数可）。チケットに紐づけておくと、レビューする人とClaudeが「どこを作業したか」を正確に特定でき、レビューと作業指示の精度が上がります。";
    const needKey = !S.fileKey;
    app.innerHTML =
      '<p><a href="#" id="back">← 一覧へ</a></p>' +
      "<h1>#" + t.seq + " " + esc(t.title) + ' <a href="#" id="edit" title="タイトル・説明を編集" style="font-size:11px;font-weight:400">✏️ 編集</a></h1>' +
      '<div class="row"><span class="chip">' + esc(t.column) + '</span><span class="chip' + (t.role === "レビュー" ? " rev" : "") + '">' + esc(t.role) + "</span></div>" +
      (t.description ? '<p class="sub" style="white-space:pre-wrap;margin-top:6px">' + esc(t.description) + "</p>" : "") +
      '<p class="mt row"><input id="addurl" placeholder="FigmaのURLを貼って紐づけ（コピペ用）" style="flex:1;min-width:120px;margin-top:0"><button id="addurlgo">追加</button></p>' +
      (t.frames.length
        ? '<p class="mt frames">紐づけ済み（クリックで移動）:<br>' +
          t.frames.map((u, i) => '<a href="#" class="frame-link" data-url="' + esc(u) + '">🔗 Frame ' + (i + 1) + "</a>").join("<br>") +
          "</p>"
        : "") +
      '<p class="mt sub">' + selInfo + "</p>" +
      (needKey
        ? '<p class="sub">初回だけ: このファイルのURL（ブラウザのアドレス欄からコピー）を貼ってください。選択したFrameへのリンクを作るために必要です。次からは聞かれません。</p>' +
          '<input id="fileurl" placeholder="https://www.figma.com/design/…">' +
          '<p class="mt"><button id="savekey">URLを追加</button></p>'
        : '<p class="mt row"><button class="primary" id="attach"' + (S.selection.length ? "" : " disabled") + '>選択中のFrameを紐づける</button>' +
          '<button id="capture"' + (S.selection.length ? "" : " disabled") + ' title="選択中のFrameのキャプチャを撮って、このチケットに貼ります">📸 キャプチャを撮る</button></p>' +
          (S.capturing
            ? '<p class="mt row"><input id="capname" placeholder="キャプチャの名前（任意・空ならFrame名）" style="flex:1;min-width:120px;margin-top:0">' +
              '<button class="primary" id="capgo">撮る</button><button id="capcancel">やめる</button></p>'
            : "")) +
      '<p class="mt row"><span class="sub">状態:</span><select id="status">' +
      S.data.columns.map((c) => '<option value="' + esc(c.name) + '"' + (c.name === t.column ? " selected" : "") + ">" + esc(c.name) + (c.role === "review" ? "（提出）" : "") + "</option>").join("") +
      "</select></p>" +
      msgHtml();
    document.getElementById("back").onclick = (e) => { e.preventDefault(); S.open = null; render(); };
    const ed = document.getElementById("edit");
    if (ed) ed.onclick = (e) => { e.preventDefault(); S.editing = true; S.msg = null; render(); };
    const aug = document.getElementById("addurlgo");
    if (aug) aug.onclick = async () => {
      const url = (document.getElementById("addurl").value || "").trim();
      if (!/figma\.com\//.test(url)) { S.msg = { t: "err", text: "FigmaのURLを貼ってください" }; render(); return; }
      try {
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls: [url] });
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq; S.msg = { t: "ok", text: r.message };
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    app.querySelectorAll(".frame-link").forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        const url = a.dataset.url;
        const m2 = url.match(/node-id=([\d]+)-([\d]+)/);
        if (m2) parent.postMessage({ pluginMessage: { type: "goto-node", nodeId: m2[1] + ":" + m2[2], url } }, "*");
        else window.open(url, "_blank");
      };
    });
    const sk = document.getElementById("savekey");
    if (sk) sk.onclick = () => {
      const m2 = (document.getElementById("fileurl").value || "").match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)/);
      if (m2) parent.postMessage({ pluginMessage: { type: "save-filekey", fileKey: m2[1] } }, "*");
      else { S.msg = { t: "err", text: "URLからファイルIDを読み取れませんでした" }; render(); }
    };
    const at = document.getElementById("attach");
    if (at) at.onclick = async () => {
      try {
        const sel = S.selection.slice();
        const urls = sel.map((n) => "https://www.figma.com/design/" + S.fileKey + "/?node-id=" + n.id.replace(":", "-"));
        const r = await api("POST", null, { action: "attach_frames", seq: t.seq, urls });
        S.msg = { t: "ok", text: r.message };
        parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
        await load(); S.open = t.seq;
      } catch (err) { S.msg = { t: "err", text: err.message }; }
      render();
    };
    const cap = document.getElementById("capture");
    if (cap) cap.onclick = () => { S.capturing = !S.capturing; render(); if (S.capturing) { const el = document.getElementById("capname"); if (el) el.focus(); } };
    const capgo = document.getElementById("capgo");
    if (capgo) capgo.onclick = async () => {
      const label = (document.getElementById("capname").value || "").trim();
      const sel = S.selection.slice();
      S.capturing = false;
      S.msg = { t: "ok", text: "キャプチャを記録しています…" };
      render();
      const ok = await uploadCaptures(t.seq, "manual", sel.map((n) => n.id), label || null);
      S.msg = ok
        ? { t: "ok", text: "キャプチャ" + ok + "件をチケットに貼りました" }
        : { t: "err", text: "キャプチャを記録できませんでした（サイズ超過の可能性）" };
      if (ok) parent.postMessage({ pluginMessage: { type: "notify", message: "キャプチャ" + ok + "件を記録しました" } }, "*");
      render();
    };
    const capcancel = document.getElementById("capcancel");
    if (capcancel) capcancel.onclick = () => { S.capturing = false; render(); };
    document.getElementById("status").onchange = (e) => {
      const toName = e.target.value;
      if (toName === t.column) return;
      move(t.seq, toName);
    };
  }

  async function move(seq, toName) {
    try {
      const r = await api("POST", null, { action: "move", seq, column: toName });
      S.msg = { t: "ok", text: r.message };
      parent.postMessage({ pluginMessage: { type: "notify", message: r.message } }, "*");
      await load(); S.open = seq;
    } catch (err) { S.msg = { t: "err", text: err.message }; }
    render();
  }
</script>
